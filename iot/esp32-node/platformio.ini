; EduAirControl - nodo ESP32 de medicion ambiental
;
; Placa: ESP32 DevKit (30 pines), framework Arduino.
; BLE y Preferences vienen con el core de ESP32: no hay que declararlos.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Solo lo que se usa: sensor DHT y JSON.
; El resto de libs del proyecto original (Async WebServer, PubSubClient,
; Arduino_JSON) no se usaban y una de ellas ni siquiera existe en su version.
lib_deps =
    adafruit/Adafruit Unified Sensor@^1.1.4
    adafruit/DHT sensor library@^1.4.6
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -DCORE_DEBUG_LEVEL=0

; La app necesita ~1.6 MB (BLE + WiFi + HTTP + ArduinoJson). El esquema por
; defecto de esp32dev reserva solo 1.3 MB, asi que se usa min_spiffs: deja
; ~1.9 MB para el programa y un SPIFFS pequeno que aqui no se usa.
board_build.partitions = min_spiffs.csv

monitor_filters = esp32_exception_decoder, time
upload_protocol = esptool
