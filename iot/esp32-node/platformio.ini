; EduAirControl - nodo ESP32 de medicion ambiental
;
; Placa: ESP32 DevKit (30 pines), framework Arduino.
; BLE y Preferences vienen con el core de ESP32: no hay que declararlos.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Solo lo que se usa: sensor DHT y JSON.
; El resto de libs del proyecto original (Async WebServer, PubSubClient,
; Arduino_JSON) no se usaban y una de ellas ni siquiera existe en su version.
lib_deps =
    adafruit/Adafruit Unified Sensor@^1.1.4
    adafruit/DHT sensor library@^1.4.6
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -DCORE_DEBUG_LEVEL=0

; Tabla propia (ADR-021): sin OTA, programa de ~3 MB y 1 MB de LittleFS para el
; buffer offline de 24 h (~207 KB). nvs conserva su posicion de siempre.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_filters = esp32_exception_decoder, time
upload_protocol = esptool
