; EduAirControl - nodo sensor ESP32 (microservicios)
; Contratos verificados contra el codigo de la plataforma:
;   ms-environment-monitoring .../monitoring/web/MeasurementController.java
;   ms-security              .../security/OAuth2ServerConfig.java  (client_credentials)
;   api-gateway              src/main/resources/application.yml    (ruta /api/v1/measurements/**)
;
; El core 2.x (espressif32@6.x) se fija a proposito: el codigo BLE usa la API
; Bluedroid clasica que espera la app movil. Core 3.x cambia la firma de los
; callbacks BLE y el nombre announced.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

build_flags =
    -DCORE_DEBUG_LEVEL=1

; ESP32-S3: mismo firmware, solo cambia el modelo de placa.
; [env:esp32-s3]
; platform = espressif32@6.9.0
; board = esp32-s3-devkitc-1
; framework = arduino