# PLANTILLA — no subir secretos reales. En producción se generan con
# `kubectl create secret` desde la bóveda (Vault/Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: eduaircontrol-secrets
  namespace: eduaircontrol
type: Opaque
stringData:
  SECURITY_USER: "security_user"
  SECURITY_PASSWORD: "REPLACE_ME"
  CLASSROOM_USER: "classroom_user"
  CLASSROOM_PASSWORD: "REPLACE_ME"
  SENSOR_USER: "sensor_user"
  SENSOR_PASSWORD: "REPLACE_ME"
  USER_MANAGEMENT_USER: "user_management_user"
  USER_MANAGEMENT_PASSWORD: "REPLACE_ME"
  MONITORING_USER: "monitoring_user"
  MONITORING_PASSWORD: "REPLACE_ME"
  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "REPLACE_ME"
  # Seed SUPER_ADMIN de ms-security (R-002): obligatorio, sin default en el codigo.
  SUPERADMIN_EMAIL: "admin@eduaircontrol.com"
  SUPERADMIN_USERNAME: "superadmin"
  SUPERADMIN_PASSWORD: "REPLACE_ME"
  # JWT_SECRET ya no se usa: los servicios validan RS256 contra el JWKS de
  # ms-security (configmap eduaircontrol-config -> JWKS_URI).
  # Claves RSA de ms-security (PEM). Montadas como ficheros en el contenedor.
  # Tras rotar las claves NO reutilices el par de desarrollo filtrado: genera
  # uno nuevo y ponlo aqui. El nombre jwt-*.pem deja claro que son las claves
  # de firma en uso, no las de desarrollo.
  jwt-private.pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME
    -----END PRIVATE KEY-----
  jwt-public.pem: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_ME
    -----END PUBLIC KEY-----
