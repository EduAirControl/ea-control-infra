name: build-services

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - ms-security
          - ms-classroom-management
          - ms-sensor-management
    steps:
      - name: Checkout ${{ matrix.service }}
        uses: actions/checkout@v4
        with:
          repository: Jhon-Cortez/${{ matrix.service }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify
        run: ./mvnw -B verify

  images:
    name: build image ${{ matrix.service }}
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - ms-security
          - ms-classroom-management
          - ms-sensor-management
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout ${{ matrix.service }}
        uses: actions/checkout@v4
        with:
          repository: Jhon-Cortez/${{ matrix.service }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
