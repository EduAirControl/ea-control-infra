name: eduaircontrol

services:
  # Frontend web (React + Vite). El build necesita saber a que gateway apuntar,
  # porque Vite incrusta VITE_API_URL en el bundle: se pasa como build arg.
  web:
    build:
      context: ../ea-control-frontend/apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    image: ${REGISTRY:-eduaircontrol}/ea-control-web:${TAG:-local}
    container_name: ea-control-web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  api-gateway:
    build: ../api-gateway
    image: ${REGISTRY:-eduaircontrol}/ea-control-api-gateway:${TAG:-local}
    container_name: api-gateway
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_URI: http://ms-security:8081
      AUTH_JWKS_URI: http://ms-security:8081/api/v1/auth/jwks
      # Endurecimiento JWT: el gateway exige estos iss/aud (deben coincidir
      # con los que emite ms-security en la misma red).
      AUTH_ISSUER: ${AUTH_ISSUER:-http://ms-security:8081}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-eduaircontrol-api}
      CLASSROOM_URI: http://ms-classroom-management:3002
      SENSOR_URI: http://ms-sensor-management:3004
      MONITORING_URI: http://ms-environment-monitoring:3003
      USER_MANAGEMENT_URI: http://ms-user-management:3007
      USER_EXPERIENCE_URI: http://ms-user-experience:3006
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
    depends_on:
      redis:
        condition: service_healthy
      ms-security:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  ms-security:
    build: ../ms-security
    image: ${REGISTRY:-eduaircontrol}/ea-control-ms-security:${TAG:-local}
    container_name: ms-security
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SERVER_PORT: 8081
      POSTGRES_URL: jdbc:postgresql://postgres-security:5432/${SECURITY_DB:-eduaircontrol_security}
      POSTGRES_USER: ${SECURITY_USER:-security_user}
      POSTGRES_PASSWORD: ${SECURITY_PASSWORD:-security_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@eduaircontrol.com}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      # Sin default: arrancar con la contraseña documentada en el repo es un
      # riesgo (R-002). Definela en .env (ver .env.example).
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?SUPERADMIN_PASSWORD is required (set it in infra/.env)}
      # Correo SMTP (recuperación de contraseña). Con SMTP_HOST vacío el código
      # se registra en el log en lugar de enviarse. En dev usa mailpit:1025.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-${SMTP_USERNAME:-}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Claves RSA desde ./secrets (gitignored): el kid del JWKS debe ser
      # estable entre recreaciones del contenedor, si no todos los tokens
      # de dispositivo (ESP32) quedan invalidos con un 401 silencioso.
      SECURITY_RSA_PRIVATE_KEY_PATH: /app/keys/test-private.pem
      SECURITY_RSA_PUBLIC_KEY_PATH: /app/keys/test-public.pem
      # iss/aud de los access tokens; el gateway los exige (AUTH_ISSUER/AUD).
      APP_SECURITY_ISSUER: ${AUTH_ISSUER:-http://ms-security:8081}
      APP_SECURITY_AUDIENCE: ${AUTH_AUDIENCE:-eduaircontrol-api}
    volumes:
      - ./secrets/test-private.pem:/app/keys/test-private.pem:ro
      - ./secrets/test-public.pem:/app/keys/test-public.pem:ro
    depends_on:
      postgres-security:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  ms-environment-monitoring:
    build: ../ms-environment-monitoring
    image: ${REGISTRY:-eduaircontrol}/ea-control-ms-environment-monitoring:${TAG:-local}
    container_name: ms-environment-monitoring
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      SERVER_PORT: 3003
      POSTGRES_URL: jdbc:postgresql://postgres-monitoring:5432/${MONITORING_DB:-eduaircontrol_monitoring}
      POSTGRES_USER: ${MONITORING_USER:-monitoring_user}
      POSTGRES_PASSWORD: ${MONITORING_PASSWORD:-monitoring_pass}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWKS_URI: http://ms-security:8081/api/v1/auth/jwks
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DB_CHANGELOG_CONTEXTS: ${DB_CHANGELOG_CONTEXTS:-}
    depends_on:
      postgres-monitoring:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3003' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 50s
    restart: unless-stopped

  ms-classroom-management:
    build: ../ms-classroom-management
    image: ${REGISTRY:-eduaircontrol}/ea-control-ms-classroom-management:${TAG:-local}
    container_name: ms-classroom-management
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      SERVER_PORT: 3002
      POSTGRES_URL: jdbc:postgresql://postgres-classroom:5432/${CLASSROOM_DB:-eduaircontrol_classrooms}
      POSTGRES_USER: ${CLASSROOM_USER:-classroom_user}
      POSTGRES_PASSWORD: ${CLASSROOM_PASSWORD:-classroom_pass}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWKS_URI: http://ms-security:8081/api/v1/auth/jwks
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres-classroom:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3002' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  ms-sensor-management:
    build: ../ms-sensor-management
    image: ${REGISTRY:-eduaircontrol}/ea-control-ms-sensor-management:${TAG:-local}
    container_name: ms-sensor-management
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      SERVER_PORT: 3004
      POSTGRES_URL: jdbc:postgresql://postgres-sensor:5432/${SENSOR_DB:-eduaircontrol_sensors}
      POSTGRES_USER: ${SENSOR_USER:-sensor_user}
      POSTGRES_PASSWORD: ${SENSOR_PASSWORD:-sensor_pass}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWKS_URI: http://ms-security:8081/api/v1/auth/jwks
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres-sensor:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3004' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  ms-user-management:
    build: ../ms-user-management
    image: ${REGISTRY:-eduaircontrol}/ea-control-ms-user-management:${TAG:-local}
    container_name: ms-user-management
    ports:
      - "127.0.0.1:3007:3007"
    environment:
      SERVER_PORT: 3007
      POSTGRES_URL: jdbc:postgresql://postgres-user-management:5432/${USER_MANAGEMENT_DB:-eduaircontrol_user_management}
      POSTGRES_USER: ${USER_MANAGEMENT_USER:-user_management_user}
      POSTGRES_PASSWORD: ${USER_MANAGEMENT_PASSWORD:-user_management_pass}
      JWKS_URI: http://ms-security:8081/api/v1/auth/jwks
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres-user-management:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3007' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  ms-user-experience:
    build: ../ms-user-experience
    image: ${REGISTRY:-eduaircontrol}/ea-control-ms-user-experience:${TAG:-local}
    container_name: ms-user-experience
    ports:
      - "127.0.0.1:3006:3006"
    environment:
      SERVER_PORT: 3006
      POSTGRES_URL: jdbc:postgresql://postgres-user-experience:5432/${USER_EXPERIENCE_DB:-eduaircontrol_user_experience}
      POSTGRES_USER: ${USER_EXPERIENCE_USER:-user_experience_user}
      POSTGRES_PASSWORD: ${USER_EXPERIENCE_PASSWORD:-user_experience_pass}
      JWKS_URI: http://ms-security:8081/api/v1/auth/jwks
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres-user-experience:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3006' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  postgres-security:
    image: postgres:15
    container_name: postgres-security
    environment:
      POSTGRES_DB: ${SECURITY_DB:-eduaircontrol_security}
      POSTGRES_USER: ${SECURITY_USER:-security_user}
      POSTGRES_PASSWORD: ${SECURITY_PASSWORD:-security_pass}
    ports:
      - "127.0.0.1:${SECURITY_DB_PORT:-5437}:5432"
    volumes:
      - security_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SECURITY_USER:-security_user} -d ${SECURITY_DB:-eduaircontrol_security}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres-classroom:
    image: postgres:15
    container_name: postgres-classroom
    environment:
      POSTGRES_DB: ${CLASSROOM_DB:-eduaircontrol_classrooms}
      POSTGRES_USER: ${CLASSROOM_USER:-classroom_user}
      POSTGRES_PASSWORD: ${CLASSROOM_PASSWORD:-classroom_pass}
    ports:
      - "127.0.0.1:${CLASSROOM_DB_PORT:-5433}:5432"
    volumes:
      - classroom_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLASSROOM_USER:-classroom_user} -d ${CLASSROOM_DB:-eduaircontrol_classrooms}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres-sensor:
    image: postgres:15
    container_name: postgres-sensor
    environment:
      POSTGRES_DB: ${SENSOR_DB:-eduaircontrol_sensors}
      POSTGRES_USER: ${SENSOR_USER:-sensor_user}
      POSTGRES_PASSWORD: ${SENSOR_PASSWORD:-sensor_pass}
    ports:
      - "127.0.0.1:${SENSOR_DB_PORT:-5434}:5432"
    volumes:
      - sensor_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SENSOR_USER:-sensor_user} -d ${SENSOR_DB:-eduaircontrol_sensors}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres-user-management:
    image: postgres:15
    container_name: postgres-user-management
    environment:
      POSTGRES_DB: ${USER_MANAGEMENT_DB:-eduaircontrol_user_management}
      POSTGRES_USER: ${USER_MANAGEMENT_USER:-user_management_user}
      POSTGRES_PASSWORD: ${USER_MANAGEMENT_PASSWORD:-user_management_pass}
    ports:
      - "127.0.0.1:${USER_MANAGEMENT_DB_PORT:-5438}:5432"
    volumes:
      - user_management_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_MANAGEMENT_USER:-user_management_user} -d ${USER_MANAGEMENT_DB:-eduaircontrol_user_management}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres-user-experience:
    image: postgres:15
    container_name: postgres-user-experience
    environment:
      POSTGRES_DB: ${USER_EXPERIENCE_DB:-eduaircontrol_user_experience}
      POSTGRES_USER: ${USER_EXPERIENCE_USER:-user_experience_user}
      POSTGRES_PASSWORD: ${USER_EXPERIENCE_PASSWORD:-user_experience_pass}
    ports:
      - "127.0.0.1:${USER_EXPERIENCE_DB_PORT:-5439}:5432"
    volumes:
      - user_experience_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_EXPERIENCE_USER:-user_experience_user} -d ${USER_EXPERIENCE_DB:-eduaircontrol_user_experience}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres-monitoring:
    image: postgres:15
    container_name: postgres-monitoring
    environment:
      POSTGRES_DB: ${MONITORING_DB:-eduaircontrol_monitoring}
      POSTGRES_USER: ${MONITORING_USER:-monitoring_user}
      POSTGRES_PASSWORD: ${MONITORING_PASSWORD:-monitoring_pass}
    ports:
      - "127.0.0.1:${MONITORING_DB_PORT:-5435}:5432"
    volumes:
      - monitoring_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MONITORING_USER:-monitoring_user} -d ${MONITORING_DB:-eduaircontrol_monitoring}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT_HOST:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Captura los correos de ms-security sin enviar nada real (solo desarrollo:
  # docker compose --profile dev up -d mailpit; UI en :8025, SMTP en :1025).
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

volumes:
  security_data:
  classroom_data:
  sensor_data:
  user_management_data:
  user_experience_data:
  monitoring_data:
  rabbitmq_data:
